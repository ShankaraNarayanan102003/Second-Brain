<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Liquid Egyptian Gold Gradients -->
    <linearGradient id="liquidGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="25%" stop-color="#E5BE53" />
      <stop offset="50%" stop-color="#9C6B1B" />
      <stop offset="75%" stop-color="#F3CE65" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5BE53" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neuDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E26" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="-6" dy="-6" stdDeviation="12" flood-color="#363A48" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#goldGlow)" />

  <!-- Base Neumorphic Circle -->
  <circle cx="256" cy="256" r="200" fill="url(#neuDark)" filter="url(#shadow3d)" stroke="url(#liquidGold)" stroke-width="4" />

  <!-- Inner Tactile Inset Rim -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#liquidGold)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />

  <!-- Stylized Neural Brain & Egyptian Pyramidion Monogram -->
  <g transform="translate(136, 136) scale(0.47)" fill="none" stroke="url(#liquidGold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere Neural Curves -->
    <path d="M 220 100 C 120 90, 70 160, 80 240 C 60 280, 80 370, 150 400 C 180 430, 220 420, 240 400" />
    <path d="M 120 230 C 160 230, 190 270, 230 280" />
    <path d="M 140 330 C 180 330, 200 370, 240 360" />
    <path d="M 150 160 C 200 170, 220 210, 240 220" />
    <!-- Right Hemisphere Neural Curves -->
    <path d="M 292 100 C 392 90, 442 160, 432 240 C 452 280, 432 370, 362 400 C 332 430, 292 420, 272 400" />
    <path d="M 392 230 C 352 230, 322 270, 282 280" />
    <path d="M 372 330 C 332 330, 312 370, 272 360" />
    <path d="M 362 160 C 312 170, 292 210, 272 220" />
    <!-- Center Egyptian Obelisk / Core Synapse -->
    <line x1="256" y1="120" x2="256" y2="390" stroke-width="12" />
    <polygon points="256,70 276,115 236,115" fill="url(#liquidGold)" stroke="none" />
    <!-- Synaptic Nodes -->
    <circle cx="256" cy="200" r="10" fill="url(#liquidGold)" />
    <circle cx="256" cy="280" r="10" fill="url(#liquidGold)" />
    <circle cx="256" cy="350" r="10" fill="url(#liquidGold)" />
  </g>
</svg>
